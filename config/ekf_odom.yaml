# =======================================================================
# robot_localization EKF — continuous `odom -> base_link` for the Mode B tree
# =======================================================================
# Replaces an identity `odom -> base_link` static_transform_publisher (the 'noekf'
# baseline in scripts/test_ekf_smoothing.sh) with a real smoothing odom layer.
#
# Tree (REP-105):
#   map ──(NDT vs gt_map, lidar_localization_ros2, enable_map_odom_tf)──> odom
#   odom ──(THIS EKF: NDT pose + /imu/data)──────────────────────────────> base_link
#   base_link ──(static extrinsics)──> os_lidar, imu
#
# pose0 is the NDT pose restamped into odom by ndt_pose_relay.py; a map-frame
# pose would be circular, as the localizer builds map->odom from this EKF. imu0
# is gyro only. map->base still equals the raw NDT pose.
# (notes: ekf-odom-design)
# =======================================================================
# Moved comments: docs/hmr_localisation_code_notes.md

ekf_filter_node:
  ros__parameters:
    # use_sim_time is set by launch/ekf_odom.launch.py (true for bag replay).

    frequency: 50.0            # odom->base broadcast rate (> NDT, < IMU)
    sensor_timeout: 0.2        # coast on the motion model if a source stalls
    two_d_mode: false          # outdoor walking route has roll/pitch/z -> full 3D
    publish_tf: true           # broadcast odom -> base_link (replaces the static TF)
    publish_acceleration: false

    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom          # -> EKF estimates & broadcasts odom -> base_link

    # --- NDT global pose, restamped to the odom frame by ndt_pose_relay.py -----
    # Fuse absolute position + orientation (6 DoF). Order of the 15-element mask:
    #   [ x,  y,  z,  roll, pitch, yaw,
    #     vx, vy, vz, vroll, vpitch, vyaw,
    #     ax, ay, az ]
    pose0: /pcl_pose_odom
    pose0_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 10
    # Mahalanobis gate: reject single-scan NDT outliers/teleports so odom->base
    # coasts on IMU + the constant-velocity model through brief NDT glitches.
    pose0_rejection_threshold: 6.0
    pose0_nodelay: false

    # --- IMU (/imu/data, frame "imu") -----------------------------------------
    # Gyro only (vroll, vpitch, vyaw), rotated into base_link by the static TF.
    # Absolute orientation is owned by the NDT pose. Fuse ax/ay/az only if
    # /imu/data has a valid orientation, keeping gravity removal true.
    # (notes: ekf-odom-imu-fusion)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 50
    imu0_remove_gravitational_acceleration: true

    # process_noise_covariance / initial_estimate_covariance: left at the
    # robot_localization defaults (reasonable 15x15 starting point). Tune here if
    # odom->base looks too stiff (raise pose noise) or too jittery (lower it).
