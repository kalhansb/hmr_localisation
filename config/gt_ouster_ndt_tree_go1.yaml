# Go1 bag: Hesai on /hesai/points; NDT uses xyz only. base_link is the bag's TF
# root, so Mode B does not collide. The Hesai is level; its frame's rolled axes
# come from /tf_static, which replay must play. (notes: ndt-go1-bag-wiring)
#
# Launch (see doc/dscovox_exploration_run.md, go1-bag variant):
#   ros2 launch lidar_localization_ros2 lidar_localization.launch.py
#     localization_param_dir:=/ws/config/gt_ouster_ndt_tree_go1.yaml
#     cloud_topic:=/hesai/points imu_topic:=/imu/data use_sim_time:=true
#     base_frame_id:=base_link
#     publish_lidar_tf:=false publish_imu_tf:=false
#
# odom -> base_link comes from the EKF (config/ekf_odom_go1.yaml).
# Moved comments: docs/hmr_localisation_code_notes.md
/**:
    ros__parameters:
      # --- registration ---
      registration_method: "NDT_OMP"
      ndt_resolution: 2.0
      ndt_step_size: 0.1
      ndt_num_threads: 16
      ndt_max_iterations: 50
      transform_epsilon: 0.01
      score_threshold: 5.0
      reject_above_score_threshold: false   # never freeze the pose on a high-residual scan

      # --- crop NDT target to a neighbourhood of the current pose ---
      enable_local_map_crop: true
      local_map_radius: 80.0
      local_map_min_points: 100
      local_map_refresh_distance: 20.0
      local_map_voxel_leaf_size: 0.0

      # --- scan preprocessing (Hesai) ---
      voxel_leaf_size: 0.2
      scan_max_range: 50.0    # 100->15 starved vertical constraint (z drifted to +2.6m);
                              # 50 m restores far geometry to pin z without the full-100 ambiguity
      scan_min_range: 1.0
      scan_period: 0.1

      # --- map (0.5 m downsample for fast load) ---
      use_pcd_map: true
      map_path: "/ws/gt_map/gt_map_us050.pcd"

      # --- initial pose: base_link pose in map (LEVEL — base_link is gravity-aligned) ---
      # Seed from scan-to-gt_map overlap: level, yaw ~106 deg; z is map ground
      # (~-0.84) plus base height (~0.74). (notes: ndt-go1-initial-pose)
      set_initial_pose: true
      initial_pose_x: 2.75
      initial_pose_y: -0.50
      initial_pose_z: -0.10
      initial_pose_qx: 0.0
      initial_pose_qy: 0.0
      initial_pose_qz: 0.798636
      initial_pose_qw: 0.601815

      # --- prediction (IMU integrated) ---
      use_odom: false
      use_imu: false
      use_imu_preintegration: true
      imu_preintegration_use_base_frame_transform: true
      predict_pose_from_previous_delta: true

      # --- TF output: Mode B (map -> odom); needs external odom -> base_link ---
      enable_map_odom_tf: true
      global_frame_id: map
      odom_frame_id: odom
      base_frame_id: base_link

      enable_debug: false
      enable_timer_publishing: false
      pose_publish_frequency: 30.0

      # --- outputs: only the pose/TF stream is consumed downstream ---
      publish_initial_map: false
      enable_path_publishing: false
      path_max_poses: 1000
