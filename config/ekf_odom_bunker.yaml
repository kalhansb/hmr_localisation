# =======================================================================
# robot_localization EKF — continuous `odom -> base_link` for the Mode B tree
# =======================================================================
# Fork of ekf_odom_go1.yaml for the 2026_07_06 "bunker_kalhan_coop" bag (AgileX
# Bunker tracked robot + Hesai LiDAR, SAME coop environment / gt_map as the go1
# and curt bags). Keeps the stock `base_link` frame — the bag's /tf_static (a
# large CAD-assembly tree) has base_link as its ROOT with the sensors below it:
#
#   base_link --(Rz 90)--> ... --> hesai_lidar   (LiDAR cloud frame, LEVEL)
#   base_link --(Rz 90)--> ... --> imu           (/imu/data frame, LEVEL)
#
# base_link is the TF ROOT (no odom->base_link in the bag), so broadcasting
# map->odom (NDT) + odom->base_link (this EKF) does NOT collide with replay.
#
# IMU: /imu/data (frame "imu", near-level body IMU, |a|~9.8 gravity +Z). This bag
# has NO /hesai/imu, so /imu/data serves both the EKF and the mapper deskew. Fuse
# angular velocity only; the gyro is rotated into base_link via the static
# base_link->..->imu TF, valid whether or not /imu/data carries a fused quaternion.
#
# Tree (REP-105):
#   map ──(NDT vs gt_map, lidar_localization_ros2)──> odom
#   odom ──(THIS EKF: NDT pose + /imu/data)──────────> base_link
#   base_link ──(bag /tf_static)──> ... -> hesai_lidar, imu
# =======================================================================

ekf_filter_node:
  ros__parameters:
    # use_sim_time is set by launch/ekf_odom.launch.py (true for bag replay).

    frequency: 50.0            # odom->base broadcast rate (> NDT, < IMU)
    sensor_timeout: 0.2        # coast on the motion model if a source stalls
    two_d_mode: false          # tracked robot has roll/pitch/z -> full 3D
    publish_tf: true           # broadcast odom -> base_link
    publish_acceleration: false

    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link       # <-- Bunker stock base frame
    world_frame: odom          # -> EKF estimates & broadcasts odom -> base_link

    # --- NDT global pose, restamped to the odom frame by ndt_pose_relay.py -----
    pose0: /pcl_pose_odom
    pose0_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 10
    pose0_rejection_threshold: 6.0
    pose0_nodelay: false

    # --- IMU (/imu/data, frame "imu") -----------------------------------------
    # Fuse angular velocity only (vroll, vpitch, vyaw). Gyro is rotated into
    # base_link via the static base_link->..->imu TF.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 50
    imu0_remove_gravitational_acceleration: true
