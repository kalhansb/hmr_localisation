# Bunker on Jetson -- the measured "stride 4" configuration.
#
# This is the exact parameter set behind the published bunker numbers, not a
# hand-tuned variant of it. scripts/jetson_bag_test_native.sh builds its config
# by taking gt_ouster_ndt_tree_realtime.yaml, substituting the bunker seed and
# base frame, and applying three overrides; this file is that result, frozen so
# the robot and the benchmark run the same thing.
#
#   Measured, bunker_jetson bag, 120 s, one pinned core (PIN_CORES=0):
#     0.80 cores    9.77 Hz (of 10 Hz)    161 MB peak RSS
#     ATE 2.3 cm median / 8.3 cm p95      memory flat (+0.4 MB/min)
#
# Differences from gt_ouster_ndt_tree_realtime.yaml -- these three, nothing else:
#   scan_channel_stride  2 -> 4     halves the scan again; the accuracy/CPU knee
#   scan_channel_count   0 -> 128   MANDATORY on Hesai, see the note at the param
#   ndt_num_threads      8 -> 1     the node is pinned to a single core
#
# Bunker wiring (full extrinsics + provenance in gt_ouster_ndt_tree_bunker.yaml):
#   cloud /hesai/points   imu /imu/data   base_frame_id base_link
#
# Registration is SMALL_VGICP, NOT the NDT_OMP of gt_ouster_ndt_tree_bunker.yaml.
# That older file is the coop-bag NDT config and was never the measured one.
#
# The initial pose below is where the bunker_jetson bag STARTS. It is a property
# of that recording, not of the robot -- set it to wherever the robot actually
# is before each live run. See docs/bunker/README.md.

/**:
    ros__parameters:
      # --- registration ---
      # SMALL_VGICP = small_gicp voxelized GICP against the cropped map target. The node
      # still builds an NDT_OMP initializer on the full map and aligns the first 5 scans
      # with it (ndt_* below) before switching to VGICP. Fallback: "NDT_OMP" -- nothing
      # else here needs to change.
      registration_method: "SMALL_VGICP"
      vgicp_voxel_resolution: 1.0  # target voxel (m); map is 0.5 m spaced -> ~8 pts/voxel
      gicp_corr_randomness: 20     # k neighbours per point for covariances (paid on every
                                   # crop refresh over the whole cropped target)
      gicp_max_correspondence_distance: 2.0  # (m) correspondence rejection radius
      ndt_resolution: 2.0          # NDT bootstrap (first 5 scans) only
      ndt_step_size: 0.1
      # OpenMP threads for the NDT bootstrap, the VGICP covariance/kd-tree/align and the
      # fitness score. NOT clamped to the visible cores: resolveRegistrationThreadCount()
      # returns this value as-is whenever it is positive, and only falls back to
      # omp_get_max_threads() when it is <= 0. So this must be set to match the cores the
      # container actually gets. 1 here because the measured run pinned the node to a
      # single core (PIN_CORES=0); the upstream realtime config uses 8 for a whole
      # AGX Orin. Set it to the cores you actually give the node -- explicitly, not 0
      # (see docs/jetson_runs.md).
      ndt_num_threads: 1
      # Number of source points the fitness score is estimated from (0 = every point,
      # exact). The exact score was the single largest cost in the node -- a nearest-
      # neighbour query per source point on the OpenMP pool, 40-48% of its CPU -- for a
      # number nothing gates (reject_above_score_threshold is false, and the twist EKF
      # clamps it at 0.1 before scaling its noise). A 1000-point sample lands within 1.5%
      # of the exact value on both bags and the track moves < 5 mm (docs/cpu_optimisation.md
      # section 8). Set 0 to get the exact score back.
      fitness_score_max_points: 1000
      ndt_max_iterations: 50       # iteration cap for both backends
      transform_epsilon: 0.01
      score_threshold: 5.0         # PCL mean-squared NN distance; same metric for NDT and VGICP
      reject_above_score_threshold: false   # never freeze the pose on a high-residual scan

      # --- crop NDT target to a neighbourhood of the current pose ---
      enable_local_map_crop: true
      # 50 m, not more: scan_max_range is 50 m, so nothing beyond ~70 m of the crop centre
      # can ever be matched, and on this site a wider crop only rebuilds the kd-tree and
      # covariances over more of the map at every refresh. Measured accuracy-neutral
      # (docs/cpu_optimisation.md section 8).
      local_map_radius: 50.0
      local_map_min_points: 100
      # Cache the cropped NDT target: crop at radius+20m, rebuild only after 20m
      # of travel (vs every scan). Map is already 0.5m spaced -> skip the no-op
      # 0.2m voxel pass on the crop.
      local_map_refresh_distance: 20.0
      local_map_voxel_leaf_size: 0.0

      # --- scan preprocessing (Hesai, /hesai/points) ---
      voxel_leaf_size: 0.2
      # Keep every N-th LiDAR channel (beam) and drop the rest before any other
      # preprocessing. 1 = all 128 channels. 2 halves the raw points and leaves ~63% of
      # the post-voxel source points (the 0.2 m voxel already merges adjacent channels
      # inside ~15 m), so preprocessing, alignment and the fitness score all shrink
      # together; azimuth resolution -- what constrains yaw -- is untouched. Measured on
      # the 8-core host (docs/cpu_optimisation.md): 2 takes the node from 3.7 to
      # 2.6 cores and median alignment from 41 to 26 ms, drops fewer scans, and moves
      # the track by 2.7 cm median (2 mm run-to-run noise) against every channel; 4 is
      # 2.1 cores / 21 ms / 4.1 cm. Set 1 to get the full-resolution behaviour back.
      # The channel is the row of an organised cloud (Ouster: 1024x128). For an
      # unorganised cloud (Hesai: 230400x1) set scan_channel_count to the beams per
      # firing block (128) so channel = index % count; with 0 the stride has no effect
      # there (the node warns once).
      scan_channel_stride: 4
      scan_channel_count: 128
      # 50 m rather than the sensor's full 100 m: beyond ~50 m the returns are too
      # sparse in the map to match, so they contribute bad correspondences and inflate
      # the residual without adding constraint.  Measured on CURTMINI against the
      # full-resolution reference trajectory -- it drops only 6% of points, but takes
      # ATE p95 from 0.119 m to 0.086 m, worst-case error from 0.45 m to 0.22 m, and
      # halves the reported fitness score (0.122 -> 0.065).  Raise it only for genuinely
      # open sites where distant structure is well represented in the map.
      scan_max_range: 50.0
      scan_min_range: 1.0
      scan_period: 0.1

      # --- map (0.5 m downsample for fast load; regenerate with downsample_map_pcl.cpp) ---
      use_pcd_map: true
      map_path: "/ws/gt_map/gt_map_us050.pcd"

      # --- initial pose: base_link pose in map ---
      # THIS SEED IS THE bunker_jetson BAG'S. Every recording starts from its own spot, so
      # replaying a different bag with this seed starts the localizer in the wrong place
      # and it never recovers. Verified seeds for the other bags, how they were recovered
      # (BBS_2D global localization against the full-resolution gt_map.ply, not hand-
      # placed), and which topics/frames each bag needs: docs/jetson_runs.md.
      # On a live robot this MUST be set to where the robot is actually parked before
      # each run -- it is a property of the run, not of the robot. See docs/bunker/README.md.
      set_initial_pose: true
      initial_pose_x: 7.82
      initial_pose_y: -4.11
      initial_pose_z: -1.17
      initial_pose_qx: 0.0
      initial_pose_qy: 0.0
      initial_pose_qz: 0.8550024006656964  # yaw 117.5 deg
      initial_pose_qw: 0.5186240399903342

      # --- prediction (IMU integrated) ---
      use_odom: false
      use_imu: false
      use_imu_preintegration: true
      imu_preintegration_use_base_frame_transform: true
      predict_pose_from_previous_delta: true

      # --- TF output: Mode B (map -> odom); needs external odom -> base_link ---
      enable_map_odom_tf: true
      global_frame_id: map
      odom_frame_id: odom
      base_frame_id: base_link

      enable_debug: false          # per-scan stdout costs real time on Jetson
      enable_timer_publishing: false
      pose_publish_frequency: 30.0

      # --- outputs: only the pose/TF stream is consumed downstream ---
      publish_initial_map: false   # don't retain/ship the map on transient_local
      enable_path_publishing: false  # full-path republish per scan grows unbounded
      path_max_poses: 1000         # bound if path publishing is ever re-enabled
